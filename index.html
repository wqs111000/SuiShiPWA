<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#df2c3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="岁时">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="stylesheet" href="calendar-polish.css?v=8">
  <title>岁时 · 个人日历</title>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar"><div><span class="eyebrow">PERSONAL CALENDAR</span><h1>岁时</h1></div><button id="themeBtn" class="icon-btn" aria-label="切换深色模式">☾</button></header>

    <section id="todayPage" class="page active"><div id="todayContent"></div></section>
    <section id="calendarPage" class="page calendar-page"><div class="calendar-topbar"><button class="calendar-nav" id="prevMonth" aria-label="上个月">‹</button><label class="calendar-title"><strong id="monthLabel"></strong><span>点击切换年月 · 双历 · 节假日</span><input id="monthPicker" type="month" aria-label="选择年月"></label><button class="calendar-nav" id="nextMonth" aria-label="下个月">›</button><button id="calendarToday" class="calendar-today">今</button></div><div class="calendar-legend"><span class="legend-rest">休</span>法定休息 <span class="legend-work">班</span>调休上班 <span class="legend-event">●</span>我的事项</div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarGrid" class="calendar-grid"></div><div id="selectedInfo" class="selected-info"></div><div id="monthSummary" class="month-summary"></div></section>
    <section id="eventsPage" class="page"><div class="section-title"><h2>我的日子</h2><button id="addBtn" class="primary small">＋ 新建</button></div><div id="eventList"></div></section>
    <section id="settingsPage" class="page"><div class="section-title"><h2>设置</h2></div><div class="settings-card"><div class="setting-row"><span>通知权限</span><button id="notifyBtn" class="text-btn">开启</button></div><p id="notifyStatus" class="muted"></p><div class="setting-row"><span>显示模式</span><span class="muted">跟随系统 / 手动切换</span></div><div class="setting-row"><span>数据存储</span><span class="muted">仅此设备</span></div></div></section>

    <nav class="tabbar"><button data-page="todayPage" class="tab active"><span>☀</span>今天</button><button data-page="calendarPage" class="tab"><span>▦</span>日历</button><button data-page="eventsPage" class="tab"><span>♡</span>日子</button><button data-page="settingsPage" class="tab"><span>⚙</span>设置</button></nav>
  </main>
  <dialog id="eventDialog"><form method="dialog" id="eventForm"><div class="dialog-head"><h3 id="dialogTitle">新建日子</h3><button value="cancel" class="icon-btn">×</button></div><input type="hidden" id="eventId"><label>名称<input id="eventName" required maxlength="40" placeholder="例如：妈妈生日"></label><label>类型<select id="eventKind"><option value="countdown">倒数日</option><option value="anniversary">纪念日</option><option value="birthday">生日</option><option value="general">事项</option></select></label><label>日期<input id="eventDate" type="date" required></label><label class="check"><input id="eventRepeat" type="checkbox"> 每年重复</label><label>备注<textarea id="eventNote" rows="3" maxlength="200" placeholder="可选"></textarea></label><label>提前提醒<select id="eventReminder"><option value="">不提醒</option><option value="0">当天</option><option value="1">提前 1 天</option><option value="3">提前 3 天</option><option value="7">提前 7 天</option></select></label><button value="default" class="primary">保存</button></form></dialog>
  <script src="app.js?v=8"></script>
</body>
</html>
